server:
  port: 8080

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:dummy@gmail.com}
    password: ${EMAIL_APP_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:cutm-auth-app}
      access-ttl-seconds: ${JWT_ACCESS_TTL:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:86400}
      refresh-token-cookie-name: refresh_token
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-http-only: true
      cookie-same-site: Lax
      cookie-domain: ${JWT_COOKIE_DOMAIN:}

# MOVED TO ROOT LEVEL
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth:
    success-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/success
    failure-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/failure